name: CI - Testes automatizados

on:
  push:
    branches: [ main, 'feat/**', 'ci/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: librum_test
          POSTGRES_USER: librum
          POSTGRES_PASSWORD: librum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Rodar testes do backend
        working-directory: ./backend
        run: ./mvnw test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/librum_test
          JWT_SECRET: ci-secret-key-somente-para-testes

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        working-directory: ./frontend
        run: npm install
      - name: Rodar lint
        working-directory: ./frontend
        run: npm run lint
      - name: Verificar build
        working-directory: ./frontend
        run: npm run build

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar arquivos YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github docker-compose.yml
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable
              brackets: disable
              document-start: disable
              new-line-at-end-of-file: disable

  check-required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos obrigatórios
        run: |
          FILES=(
            "README.md"
            ".github/workflows/ci.yml"
            "docs/riscos.md"
            ".github/PULL_REQUEST_TEMPLATE.md"
            "docs/padroes-de-projeto.md"
          )
          MISSING=0
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERRO: arquivo obrigatório não encontrado: $f"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi
          echo "Todos os arquivos obrigatórios estão presentes."